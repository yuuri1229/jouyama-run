# =========================================================
# GitHub Pages 自動デプロイ
# main ブランチに変更をコミット（push）するたびに、
# サイトを自動でビルドして公開します。
# プルリクエストでは「ビルドが通るか」だけを確認し、公開はしません
# （以前はPRに自動チェックが無く、壊れたビルドを main に入れて初めて気づけた）。
# 事前に リポジトリの Settings → Pages → Source を
# 「GitHub Actions」に設定しておいてください。
# =========================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PRではビルド確認だけ行う（成果物のアップロードとデプロイは下の if で除外）
  pull_request:
    branches: [main]
  workflow_dispatch:
  # microCMSのWebhookから叩かれ、記事の公開・更新時に自動で再ビルドする
  repository_dispatch:
    types: [microcms-update]
  # 静的サイトなので「エントリー受付中／受付終了」の判定はビルド時刻で決まる。
  # 1日1回ビルドし直すことで、締切を過ぎたら自動で表示が切り替わるようにする。
  schedule:
    - cron: "0 20 * * *" # 毎日 05:00 JST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 公開用(pages)とPR確認用でグループを分ける。同じグループにすると、PRのビルドが
  # 始まった時点で、実行中の公開ジョブが cancel-in-progress で取り消されてしまう
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # package-lock.json をキーに node_modules をキャッシュして
          # 毎回のインストールを短縮する
          cache: npm

      - name: 依存パッケージをインストール
        # npm install だとロックファイルを書き換えてしまい、
        # 「ローカルでは動くのにデプロイだけ壊れる」の原因になる。
        # npm ci はロックファイルどおりに入れるので毎回同じ結果になる。
        run: npm ci

      - name: ベースパスを判定
        id: basepath
        # public/CNAME があれば独自ドメイン（ルート直下で公開）なのでベースパス不要。
        # なければ「ユーザー名.github.io」判定 → それ以外は /リポジトリ名 を自動設定
        # (GitHub Actionsの `&&`/`||` 式は空文字列を偽値として扱うため、
        #  シェルのif文で明示的に判定する)
        run: |
          if [ -f public/CNAME ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: サイトをビルド
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}
          # microCMS のAPIキー（Settings → Secrets and variables → Actions に登録）
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          # サービスドメインは既定で niigata24h。変更する場合のみ Secrets/Variables で上書き
          MICROCMS_SERVICE_DOMAIN: ${{ vars.MICROCMS_SERVICE_DOMAIN }}

      - name: ビルド結果を確認
        # microCMS から記事を取れなかった場合は、ビルド自体が失敗する（lib/microcms.js）。
        # ここでは出力に最低限のページがあることを確かめる
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/sitemap.xml

      - name: 成果物をアップロード
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # PRでは公開しない
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
