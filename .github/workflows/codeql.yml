# =========================================================
# CodeQL によるコードの自動検査（GitHub 提供・公開リポジトリは無料）
# ---------------------------------------------------------
# プログラム（JavaScript）とワークフロー（GitHub Actions）を解析し、
# XSS・スクリプト注入などの脆弱性につながる書き方を見つけます。
# 結果はリポジトリの Security → Code scanning に表示されます。
#
# ・main への変更・プルリクエストのたびに実行し、週1回は新しい
#   検査ルールで全体を検査し直す（攻撃手法の変化に追従するため）。
# ・アクションは deploy.yml と同じくコミットID（40桁）で固定する。
# =========================================================
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 18 * * 0" # 毎週月曜 03:41 JST

# 既定では何の権限も渡さない（ジョブで必要な分だけ指定する）
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 解析 (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # リポジトリの読み取り
      security-events: write # 検査結果の登録
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL を準備
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # ビルド不要の解析（静的サイトのソースをそのまま読む）
          build-mode: none
          # 標準ルールに加え、セキュリティ寄りの追加ルールも使う
          queries: security-extended

      - name: 解析して結果を登録
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
